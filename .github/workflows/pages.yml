name: Pages

# Publica o site do projeto na branch gh-pages a cada push na main.
# Em Settings > Pages: Source = Deploy from a branch, Branch = gh-pages / (root).
# (O deploy via actions/deploy-pages falhava ao buscar o artefato em nov/2026.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:dashboard
      - name: Publicar em gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/dashboard
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site: ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
