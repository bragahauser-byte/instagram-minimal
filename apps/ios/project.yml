# Projeto Xcode gerado com XcodeGen (https://github.com/yonaskolb/XcodeGen).
# No Mac (na raiz do repositório):
#   npm ci && npm run build:ext && node scripts/sync-safari.mjs
#   cd apps/ios && xcodegen
# Depois abra InstagramMinimal.xcodeproj, escolha seu Team em Signing & Capabilities e rode.
name: InstagramMinimal
options:
  bundleIdPrefix: io.github.bragahauser.instagramminimal
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  InstagramMinimal-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes: ["*.entitlements"]
    settings:
      base:
        PRODUCT_NAME: Instagram Minimal
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bragahauser.instagramminimal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Instagram Minimal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: InstagramMinimalExtension-iOS

  InstagramMinimalExtension-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources
        type: folder
        buildPhase: resources
    info:
      path: Extension/Info-iOS.plist
      properties:
        CFBundleDisplayName: Instagram Minimal
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_NAME: Instagram Minimal Extension
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bragahauser.instagramminimal.extension

  InstagramMinimal-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes: ["*.entitlements"]
    entitlements:
      path: Shared/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Instagram Minimal
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bragahauser.instagramminimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - target: InstagramMinimalExtension-macOS

  InstagramMinimalExtension-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources
        type: folder
        buildPhase: resources
    info:
      path: Extension/Info-macOS.plist
      properties:
        CFBundleDisplayName: Instagram Minimal
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Instagram Minimal Extension
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bragahauser.instagramminimal.extension
        ENABLE_HARDENED_RUNTIME: YES
