<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conteúdo bloqueado · Instagram Minimal</title>
<style>
  :root{color-scheme:light dark;--bg:#fff;--t:#1C1C1E;--t2:#86868B;--a:#007AFF}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--t:#F5F5F7;--t2:#98989D;--a:#0A84FF}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--t);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
  .card{max-width:340px}
  img{width:44px;height:44px;margin-bottom:20px;border-radius:11px}
  h1{font-size:19px;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
  p{font-size:14px;line-height:1.45;color:var(--t2);margin:0 0 24px}
  a{display:inline-block;background:var(--a);color:#fff;text-decoration:none;font-weight:500;font-size:15px;padding:11px 22px;border-radius:980px}
  a:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="icons/icon-128.png" alt="" width="44" height="44">
    <h1 id="title">Este conteúdo foi bloqueado pelo Instagram Minimal.</h1>
    <p>Links de Reels não abrem enquanto a proteção estiver ativa. Mensagens, Stories e posts de quem você segue continuam normais.</p>
    <a id="back" href="https://www.instagram.com/">Voltar ao Instagram</a>
  </div>
</main>
<script src="blocked.js"></script>
</body>
</html>
